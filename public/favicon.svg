<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0d1117"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#cyberGrad)" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Cyber brackets with central dot -->
  <path d="M 22 22 L 14 32 L 22 42" stroke="#14b8a6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 42 22 L 50 32 L 42 42" stroke="#6366f1" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="32" r="3.5" fill="#38bdf8" filter="url(#glow)"/>
</svg>
